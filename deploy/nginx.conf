# Single entry point for the split deployment: routes by path to the role-specific services.
# Docker DNS returns every replica's address, and nginx balances across them (round robin).
events {}

http {
    upstream ingest_pool {
        server ingest:8080;
    }

    upstream analytics_pool {
        server analytics:8080;
    }

    server {
        listen 80;
        client_max_body_size 5m;
        # Forward the client Host (with port): upstream names like ingest_pool are not valid hostnames for Tomcat,
        # and the original host keeps the samples Link header pointing at the gateway
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        location = /v1/events/ingest {
            proxy_pass http://ingest_pool;
        }

        location /v1/stats/ {
            proxy_pass http://analytics_pool;
        }

        location = /v1/events/samples {
            proxy_pass http://analytics_pool;
        }

        location = /health {
            access_log off;
            return 200 "ok\n";
        }
    }
}
