spring:
  application:
    name: mini-wsa
  datasource:
    url: jdbc:clickhouse://${CLICKHOUSE_HOST:localhost}:${CLICKHOUSE_PORT:8123}/${CLICKHOUSE_DB:miniwsa}
    username: ${CLICKHOUSE_USER:default}
    password: ${CLICKHOUSE_PASSWORD:}
    driver-class-name: com.clickhouse.jdbc.Driver
    hikari:
      maximum-pool-size: 10
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 2s
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JacksonJsonSerializer
      # Wait for all in-sync replicas: a 201 means the batch is durably stored
      acks: all
      compression-type: lz4
      properties:
        enable.idempotence: true
        # Small batching window for throughput; adds at most 5ms to ingest latency
        linger.ms: 5
        # Fail fast instead of blocking request threads when the broker is unreachable
        max.block.ms: 5000
        # Type info is not needed: consumers bind to IngestedEvent explicitly
        spring.json.add.type.headers: false
  threads:
    virtual:
      enabled: true
  lifecycle:
    # Graceful shutdown budget per phase (compose stop_grace_period is 30s)
    timeout-per-shutdown-phase: 25s

server:
  port: ${APP_PORT:8080}
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health, info, metrics

miniwsa:
  # Parts of the pipeline this process runs: ingest, processing, analytics (override with MINIWSA_ROLES)
  roles: ingest, processing, analytics
  kafka:
    topic: dlr-raw
    dlt-topic: dlr-raw.DLT
  clickhouse:
    # Create the dlr_events table on startup if missing (idempotent)
    init-schema: true
  api:
    # Retry-After header value on 503 responses
    retry-after: 5s
  ingest:
    # Requests larger than this are rejected with 413 before the body is parsed
    max-body-size: 5MB
    # Batches with more events than this are rejected with 413
    max-batch-size: 1000
    # Reject events whose timestamp is further ahead of server time than this
    max-future-skew: 5m
    # How long to wait for Kafka acknowledgement before answering 503
    publish-timeout: 5s
  repeat-offender:
    # Look-back window for the repeat-offender bonus, measured in event time
    window: 10m
    # Earlier events of the same client IP required for the +15 bonus ("more than 5")
    min-prior-events: 6
    # Newest entries kept per IP in Redis; must be >= min-prior-events. Raise it to tolerate more out-of-order events
    max-entries: 6
    # Grace period for late events; Redis keys expire after window + allowed-lateness of inactivity
    allowed-lateness: 5m
    key-prefix: "ro:"
