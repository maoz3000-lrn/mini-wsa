spring:
  application:
    name: mini-wsa
  threads:
    virtual:
      enabled: true
  lifecycle:
    # Graceful shutdown budget per phase (compose stop_grace_period is 30s)
    timeout-per-shutdown-phase: 25s

server:
  port: ${APP_PORT:8080}
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health, info, metrics

miniwsa:
  # Parts of the pipeline this process runs: ingest, processing, analytics (override with MINIWSA_ROLES)
  roles: ingest, processing, analytics
  ingest:
    # Reject events whose timestamp is further ahead of server time than this
    max-future-skew: 5m
